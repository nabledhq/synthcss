<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SynthCSS tokens demo</title>
  <link rel="stylesheet" href="../src/tokens.css">
  <style>
    /* Demo rules: every value comes from a token. */
    body {
      margin: 0;
      padding: var(--space-6);
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
    }
    .stack { display: grid; gap: var(--space-5); max-width: var(--content-width); }
    .card {
      padding: var(--space-4);
      background: var(--color-surface);
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .card h2 { margin: 0 0 var(--space-2); font-size: var(--text-xl); font-weight: var(--weight-semibold); line-height: var(--leading-tight); }
    .card p { margin: 0 0 var(--space-3); color: var(--color-text-secondary); }
    .card small { display: block; margin-bottom: var(--space-3); color: var(--color-text-muted); font-size: var(--text-sm); }
    .button {
      height: var(--control-height);
      padding: 0 var(--space-4);
      border: 0;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-on-primary);
      font: inherit;
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: background-color var(--duration-fast) var(--ease-standard);
    }
    .button:hover { background: var(--color-primary-hover); }
    .button:focus-visible { outline: var(--focus-width) solid var(--focus-color); outline-offset: var(--focus-offset); }

    /* Consumer overrides: only tokens change, the rules above stay the same. */
    .theme-compact { --space-3: 0.5rem; --space-4: 0.75rem; --control-height: 2rem; }
    .theme-round { --radius-md: 1rem; }
    .theme-accent { --color-primary: #6b4e8a; --color-primary-hover: #573f71; --focus-color: #6b4e8a; }
  </style>
</head>
<body>
  <main class="stack">
    <section class="card">
      <h2>Default tokens</h2>
      <p>These rules only use <code>var(--token)</code>.</p>
      <small>Muted metadata text</small>
      <button class="button" type="button">Primary action</button>
    </section>
    <section class="card theme-compact">
      <h2>More compact</h2>
      <p>Overrides <code>--space-3</code>, <code>--space-4</code> and <code>--control-height</code>.</p>
      <button class="button" type="button">Primary action</button>
    </section>
    <section class="card theme-round">
      <h2>Rounder</h2>
      <p>Overrides <code>--radius-md</code>.</p>
      <button class="button" type="button">Primary action</button>
    </section>
    <section class="card theme-accent">
      <h2>Different accent</h2>
      <p>Overrides <code>--color-primary</code> and <code>--color-primary-hover</code>.</p>
      <button class="button" type="button">Primary action</button>
    </section>
  </main>
</body>
</html>
